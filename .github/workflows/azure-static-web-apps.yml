name: Deploy Fullstack App to Azure Static Web App

on:
  push:
    branches:
      - main
      - dev_push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Python (for API backend)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Install API dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r medical-webapp/api/requirements.txt

      # 🔍 Debug: show repo contents
      - name: List repo contents
        run: |
          echo "Root of repo:"
          ls -R .
          echo "Frontend folder:"
          ls -R medical-webapp/frontend

      # 4️⃣ Deploy to Azure Static Web App
      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "medical-webapp/frontend"   # 👈 matches your index.html
          api_location: "medical-webapp/api"
          output_location: ""
